version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: pixaflip-redis
    ports:
      - "6379:6379"
    restart: always

  # Optional: Redis Insight (Visualizer)
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: pixaflip-redis-insight
    ports:
      - "8001:8001"
    depends_on:
      - redis

